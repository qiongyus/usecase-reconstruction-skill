# 用例模型清单 —— 由 scripts/check_usecase_model.py 做机械约束检查。
#
# 依据：
#   模型结构   UML 2.5.1 §18（Actor / UseCase / Include / Extend / subject）
#   场景要求   ISO/IEC/IEEE 29148:2018 Annex A.2.7、§9.4.17
#   功能细节   29148:2018 §9.6.12 a)–e)
#
# 纪律：goal_confidence 与 actor.confidence 不得取 fact ——
#       用例名与 actor 目标恒为推断（代码里只有物理接口与执行路径）。

subject:
  name: "<系统名>"
  # UML §18.1.3.1：subject 可以是 system、Component 或 Class
  boundary: "<边界的一句话描述，如：单进程 HTTP 服务>"
  evidence: "<file:line>"

# 取证路径（三档，档位由证据强度决定，不由文档有无决定，见
# references/evidence-discipline.md 三）：
#   strong | A 强证据  | 有需求/用例文档、BDD feature、e2e 测试或 API 契约 | 目标层置信度上限 inferred_high
#   weak   | A− 弱证据 | 仅有 README / docs / CHANGELOG                   | 目标层置信度上限 inferred_medium
#   none   | B 无文档  | 四类文档证据全无                                  | 目标层置信度上限 inferred_low / gap
# 由 scripts/inventory_docs.sh 给出建议起点，逐条置信度仍须按证据实际核定。
evidence_path: strong

actors:
  - id: <actor-id>
    name: "<角色名>"
    # UML §18.1.3.1：Actor 是 role 而非实体；一个物理实例可扮演多个 actor
    kind: human            # human | external_system | timer
    goal: "<该 actor 想达成什么>"
    # 恒为推断。strong 档出处用 inferred_high，weak 档出处用 inferred_medium，
    # none 档（无出处）用 inferred_low 或 gap
    confidence: inferred_high
    evidence: ["<file:line>"]
    # strong 与 weak 两档必填：目标的文字出处（weak 档同样有出处，只是证据
    # 强度较弱，如 README；none 档无文字出处，留空并在缺口中说明）
    source: "<README.md:12 或 docs/xxx.md#section>"

use_cases:
  - id: UC-01
    # UML §18.2.5.6 must_have_name；命名动词开头（REQ-N03）
    name: "<动词开头的用例名>"
    level: user_goal       # user_goal | subfunction
    actors: [<actor-id>]
    # UML §18.1.3.1 完整性判据：执行后 subject 是否处于
    # 「无待续输入、可重新发起」或错误态？写出判定理由。
    completeness_check: "<判定理由>"
    goal_confidence: inferred_high
    entrypoints: ["<HTTP 路由 / CLI 子命令 / 导出符号>"]
    evidence: ["<file:line>"]
    includes: []           # UML §18.1.3.3：被包含用例的 id 列表
    extends: []            # UML §18.1.3.2：被扩展用例的 id 列表
    # UML §18.2.5.6 no_association_to_use_case：同一 subject 的用例之间不得
    # 建立关联，因为每个用例各自描述对 subject 的一次完整使用（§18.1.3.1）。
    # 故此字段恒为空列表；若发现代码证据显示两个用例间存在关联，应视为建模
    # 错误并拆分/合并用例，而不是在此填入用例 id。
    associations: []
    preconditions: []
    postconditions: []
    scenarios:
      # 29148 A.2.7：normal / stress / exception / degraded 四类变体
      # §9.4.17：场景须唯一命名与编号
      - id: SC-01-normal
        variant: normal    # normal | stress | exception | degraded
        steps:
          - "<step-by-step 描述，含 events/actions/stimuli/information/interactions>"
    # 29148 §9.6.12 a)–e)，逐项填写或显式写「未发现」
    function_details:
      input_validation: "<a) 输入有效性校验>"
      operation_sequence: "<b) 精确的操作序列>"
      abnormal_responses: "<c) 异常响应：溢出/通信/硬件故障/错误处理与恢复>"
      parameter_effects: "<d) 参数的作用>"
      io_relationship: "<e) 输出与输入的关系>"

# 29148 A.2.7 覆盖要求：所有操作模式 × 所有用户类别
operational_modes: [normal]
user_classes: [<actor-id>]
